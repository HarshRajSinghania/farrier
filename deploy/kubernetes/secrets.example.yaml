# Do not commit real values. Prefer your cloud's secret store through the External Secrets
# Operator or the Secrets Store CSI driver (AWS Secrets Manager, GCP Secret Manager, Azure Key Vault).
#
# Generate values:
#   api-token / dashboard-password: openssl rand -hex 32
#   master-key: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
apiVersion: v1
kind: Secret
metadata:
  name: farrier-secrets
  namespace: farrier
type: Opaque
stringData:
  api-token: "replace-me"
  dashboard-password: "replace-me"
  master-key: "replace-me"
---
# Device credentials, mounted read-only at /run/secrets/farrier and referenced from connector
# configs as file:/run/secrets/farrier/<key>, e.g. "password": "file:/run/secrets/farrier/f5-password"
apiVersion: v1
kind: Secret
metadata:
  name: farrier-device-secrets
  namespace: farrier
type: Opaque
stringData:
  f5-password: "replace-me"
