# farrier-secrets from HashiCorp Vault (KV v2), through the External Secrets Operator with Vault's
# Kubernetes auth method. The Vault role should bind this service account and a policy that reads
# secret/data/farrier/runtime/* only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: farrier-external-secrets
  namespace: farrier
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: hashicorp-vault
  namespace: farrier
spec:
  provider:
    vault:
      server: https://vault.example.internal:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: farrier-external-secrets
          serviceAccountRef:
            name: farrier-external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: farrier-secrets
  namespace: farrier
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: hashicorp-vault
  target:
    name: farrier-secrets
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef: { key: farrier/runtime, property: api-token }
    - secretKey: dashboard-password
      remoteRef: { key: farrier/runtime, property: dashboard-password }
    - secretKey: master-key
      remoteRef: { key: farrier/runtime, property: master-key }
