# Only the dashboard may call the engine's API. Your Prometheus namespace may scrape /metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: farrier-engine-ingress
  namespace: farrier
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: farrier, app.kubernetes.io/component: engine }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: farrier, app.kubernetes.io/component: web }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports: [{ port: 8740, protocol: TCP }]
