# Farrier engine: one replica (SQLite has one writer), its data on a persistent volume.
# Works on EKS, GKE, AKS, OpenShift and any conformant cluster. See /docs/deploy.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: farrier
  namespace: farrier
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: farrier
  namespace: farrier
  labels: { app.kubernetes.io/name: farrier, app.kubernetes.io/component: engine }
spec:
  serviceName: farrier
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: farrier, app.kubernetes.io/component: engine }
  template:
    metadata:
      labels: { app.kubernetes.io/name: farrier, app.kubernetes.io/component: engine }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8740"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: farrier
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: farrier
          image: ghcr.io/gagankarthik/farrier:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8740 }]
          env:
            - { name: FARRIER_DATA, value: /data }
            # connectors may only read env vars with this prefix and files under /run/secrets/farrier
            - { name: FARRIER_SECRET_ENV_PREFIX, value: FARRIER_SECRET_ }
            - { name: FARRIER_SECRET_DIRS, value: /run/secrets/farrier }
            - name: FARRIER_API_TOKEN
              valueFrom: { secretKeyRef: { name: farrier-secrets, key: api-token } }
            - name: FARRIER_MASTER_KEY
              valueFrom: { secretKeyRef: { name: farrier-secrets, key: master-key } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: device-secrets, mountPath: /run/secrets/farrier, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: device-secrets
          secret: { secretName: farrier-device-secrets, optional: true, defaultMode: 0400 }
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        # EKS: gp3 · GKE: standard-rwo · AKS: managed-csi · on-prem: your block storage class
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: farrier
  namespace: farrier
  labels: { app.kubernetes.io/name: farrier, app.kubernetes.io/component: engine }
spec:
  # cluster-internal only: the dashboard is the one way in
  type: ClusterIP
  selector: { app.kubernetes.io/name: farrier, app.kubernetes.io/component: engine }
  ports: [{ name: http, port: 8740, targetPort: http }]
