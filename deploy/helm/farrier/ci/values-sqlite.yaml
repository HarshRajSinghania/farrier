# Single-node install: SQLite on a PVC (one engine replica), dev-only generated Secret,
# Basic auth, nginx Ingress. Exercises: StatefulSet path, secrets.mode=create, Ingress.
database:
  type: sqlite

secrets:
  mode: create

engine:
  persistence:
    size: 5Gi
    storageClass: standard
  networkPolicy:
    managementNetworks:
      - cidr: 10.50.0.0/16
        ports: [443, 8443]

web:
  replicaCount: 1
  auth:
    mode: basic
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/whitelist-source-range: 10.0.0.0/8
    hosts:
      - host: farrier.example.internal
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: farrier-web-tls
        hosts: [farrier.example.internal]
