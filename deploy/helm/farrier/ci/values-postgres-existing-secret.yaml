# HA install: PostgreSQL, three engine replicas, Secrets you manage, OIDC sign-in, Gateway API,
# web autoscaling, ServiceMonitor. Exercises: Deployment path, existingSecret, HTTPRoute, HPA.
database:
  type: postgresql
  url: postgresql://farrier@db.internal:5432/farrier?sslmode=verify-full&sslrootcert=/etc/farrier/db-tls/ca.crt
  tls:
    existingSecret: farrier-db-ca

secrets:
  mode: existingSecret
  existingSecret:
    engine: farrier-engine
    web: farrier-web

engine:
  replicaCount: 3
  shutdownGrace: 30
  storage:
    url: s3://farrier-artifacts/prod
    s3Endpoint: https://minio.storage.internal
  deviceSecrets:
    existingSecret: farrier-device-secrets
  config:
    FARRIER_TRUST_BUNDLE: /etc/farrier/db-tls/ca.crt
  networkPolicy:
    metricsNamespaceSelector:
      kubernetes.io/metadata.name: monitoring
    database:
      cidrs: [10.20.0.0/24]
    managementNetworks:
      - cidr: 10.50.0.0/16
        ports: [443, 8443, 22]
  metrics:
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
  priorityClassName: platform-critical

web:
  siteUrl: https://farrier.example.com
  auth:
    mode: oidc
    oidc:
      issuer: https://example.okta.com/oauth2/default
      clientId: 0oa1b2c3d4
      adminGroups: pki-admins
      operatorGroups: netops,secops
  httpRoute:
    enabled: true
    parentRefs:
      - name: public
        namespace: gateway-system
        sectionName: https
    hostnames: [farrier.example.com]
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
  networkPolicy:
    ingressFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: gateway-system
