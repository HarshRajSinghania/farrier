# EKS install: RDS PostgreSQL, Secrets synced from AWS Secrets Manager by the External Secrets
# Operator, IRSA for KMS + Secrets Manager + S3, ALB Ingress.
# Exercises: externalSecrets, cloud identity annotations, KMS master key, aws secret backend.
database:
  type: postgresql
  url: postgresql://farrier@farrier.cluster-abc123.eu-west-1.rds.amazonaws.com:5432/farrier?sslmode=verify-full

secrets:
  mode: externalSecrets
  externalSecrets:
    secretStoreRef:
      name: aws-secrets-manager
      kind: ClusterSecretStore
    remoteRefs:
      apiToken: { key: prod/farrier, property: api-token }
      apiReadToken: { key: prod/farrier, property: api-read-token }
      databasePassword: { key: prod/farrier/rds, property: password }
      dashboardPassword: { key: prod/farrier, property: dashboard-password }

engine:
  masterKey:
    kms: aws-kms:arn:aws:kms:eu-west-1:123456789012:key/1234abcd-12ab-34cd-56ef-1234567890ab
  secretBackend:
    type: aws
    aws:
      region: eu-west-1
      prefix: farrier/prod/
  storage:
    url: s3://acme-farrier-prod/artifacts
    kmsKey: arn:aws:kms:eu-west-1:123456789012:key/1234abcd-12ab-34cd-56ef-1234567890ab
  serviceAccount:
    cloudIdentity:
      awsRoleArn: arn:aws:iam::123456789012:role/farrier-engine
  networkPolicy:
    database:
      cidrs: [10.0.32.0/20]
    managementNetworks:
      - cidr: 10.100.0.0/16
        ports: [443]

web:
  ingress:
    enabled: true
    className: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internal
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-west-1:123456789012:certificate/abcd
    hosts:
      - host: farrier.corp.example.com
        paths:
          - path: /
            pathType: Prefix
