{{- /* One ServiceAccount per component, with optional cloud workload identity annotations. */}}
{{- range $component := list "engine" "web" }}
{{- $v := index $.Values $component }}
{{- if and $v.serviceAccount.create (or (eq $component "engine") $.Values.web.enabled) }}
{{- $ctx := dict "ctx" $ "component" $component }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  {{- include "farrier.metadata" (merge (dict "name" (include "farrier.serviceAccountName" $ctx) "annotations" (include "farrier.serviceAccountAnnotations" $v | fromYaml)) $ctx) | nindent 2 }}
automountServiceAccountToken: {{ include "farrier.automountToken" $ctx }}
{{- end }}
{{- end }}
