{{- /* Dashboard Ingress. The engine is never routed: the dashboard proxies to it server-side. */}}
{{- if and .Values.web.enabled .Values.web.ingress.enabled }}
{{- $ctx := dict "ctx" . "component" "web" }}
{{- $i := .Values.web.ingress }}
{{- $service := include "farrier.componentName" $ctx }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  {{- include "farrier.metadata" (merge (dict "annotations" $i.annotations) $ctx) | nindent 2 }}
spec:
  {{- with $i.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with $i.tls }}
  tls:
    {{- range . }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      {{- with get . "secretName" }}
      secretName: {{ . | quote }}
      {{- end }}
    {{- end }}
  {{- end }}
  rules:
    {{- range required "web.ingress.hosts needs at least one host" $i.hosts }}
    - host: {{ required "web.ingress.hosts[].host is required" .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | default "/" | quote }}
            pathType: {{ get . "pathType" | default "Prefix" }}
            backend:
              service:
                name: {{ $service }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
