# Self-contained pytest config for functions/: `python -m pytest -q functions` from the
# repo root picks this file (it is closer than pyproject.toml), so the main tests/ suite
# and its settings are unaffected. No network or cloud credentials are needed.
[pytest]
testpaths = .
pythonpath = common aws gcp azure testkit
addopts = --import-mode=importlib -p no:cacheprovider
