# Weekly dependency updates, grouped so they arrive as a few pull requests instead of many.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups: { web: { patterns: ["*"], update-types: [minor, patch] } }
    ignore:
      # typescript-eslint does not support TypeScript 7 yet; lift once it does
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: npm
    directory: /site
    schedule: { interval: weekly }
    groups: { site: { patterns: ["*"], update-types: [minor, patch] } }
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /web
    schedule: { interval: weekly }
    ignore:
      # odd-numbered Node.js releases are never LTS; stay on even (LTS) majors
      - dependency-name: node
        versions: ["25", "27", "29"]
